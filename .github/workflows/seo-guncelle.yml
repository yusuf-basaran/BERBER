name: SEO sayfalarını güncelle
on:
  push:
    branches: [main]
    paths:
      - scripts/seo-uret.js
      - lib/seo.cjs
      - js/i18n.js
      - .github/workflows/seo-guncelle.yml
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-guncelle
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Sayfaları üret
        run: node scripts/seo-uret.js
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "BERBER bakım"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml robots.txt .seo-dosyalar.json
          if ! git diff --cached --quiet; then
            git commit -m "SEO sayfalarını güncelle"
            git push
          fi

