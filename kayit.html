<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,follow"><title data-i18n="auth.registerTitle"></title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"><script type="module" src="./js/account-page.js"></script></head>
<body><a class="skip-link" href="#main" data-i18n="nav.skip"></a><header class="site-header"><a class="wordmark" href="./index.html" data-i18n="site.name"></a><nav class="header-links" data-i18n-aria-label="site.name"><a href="./giris.html" data-i18n="nav.login"></a><a href="./kayit.html" data-i18n="nav.register"></a></nav></header>
<main id="main" class="account-layout account-layout--register" data-account="register"><aside class="account-story"><p class="eyebrow" data-i18n="auth.kicker"></p><h2 data-i18n="auth.heroTitle"></h2><p class="story-text" data-i18n="auth.heroText"></p><p class="story-detail" data-i18n="auth.heroDetail"></p><div class="story-lines" aria-hidden="true"><span></span><span></span><span></span></div></aside><section class="account-card"><p class="eyebrow" data-i18n="nav.register"></p><h1 data-i18n="auth.registerTitle"></h1><p class="intro" data-i18n="auth.registerSubtitle"></p><p class="notice" data-account-status hidden tabindex="-1" aria-live="polite" aria-atomic="true" role="status"></p><form id="register-form" novalidate><fieldset class="role-field" data-field><legend data-i18n="field.role"></legend><div class="role-options"><label class="role-choice"><input type="radio" name="role" value="customer" checked><span><strong data-i18n="field.customer"></strong><small data-i18n="auth.roleCustomerHint"></small></span></label><label class="role-choice"><input type="radio" name="role" value="barber"><span><strong data-i18n="field.barber"></strong><small data-i18n="auth.roleBarberHint"></small></span></label></div></fieldset>
<div class="field" data-field><label for="register-fullName" data-i18n="field.fullName"></label><input id="register-fullName" name="fullName" type="text" autocomplete="name" required minlength="2" maxlength="100"></div>
<div class="field" data-field><label for="register-phone" data-i18n="field.phone"></label><input id="register-phone" name="phone" type="tel" autocomplete="tel" required maxlength="24" aria-describedby="phone-hint"></div><p id="phone-hint" class="field-hint" data-i18n="field.phoneHint"></p>
<div class="field" data-field><label for="register-email" data-i18n="field.email"></label><input id="register-email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
<div class="field" data-field><label for="register-password" data-i18n="field.password"></label><div class="password-input"><input id="register-password" name="password" type="password" autocomplete="new-password" required maxlength="128" aria-describedby="password-hint"><button type="button" class="password-toggle" data-password-toggle="register-password" aria-controls="register-password" aria-pressed="false" data-i18n="common.show" data-i18n-aria-label="common.passwordShow"></button></div><p id="password-hint" class="field-hint" data-i18n="auth.passwordHint"></p></div><div class="field" data-field><label for="register-password-again" data-i18n="field.passwordAgain"></label><div class="password-input"><input id="register-password-again" name="passwordAgain" type="password" autocomplete="new-password" required maxlength="128" ><button type="button" class="password-toggle" data-password-toggle="register-password-again" aria-controls="register-password-again" aria-pressed="false" data-i18n="common.show" data-i18n-aria-label="common.passwordShow"></button></div></div>
<div class="consent" data-field><label><input type="checkbox" name="termsAccepted" required><span data-i18n="auth.termsConsent"></span></label><a href="./kosullar.html" target="_blank" rel="noopener noreferrer" data-i18n="nav.terms"></a></div><div class="consent" data-field><label><input type="checkbox" name="privacyAccepted" required><span data-i18n="auth.privacyConsent"></span></label><a href="./kisisel-veri.html" target="_blank" rel="noopener noreferrer" data-i18n="nav.privacy"></a></div><button class="button" type="submit" data-i18n="auth.registerButton"></button></form>
<div class="registration-success" data-registration-success hidden><a class="button" href="./giris.html" data-i18n="auth.backToLogin"></a></div><details class="resend" data-resend><summary data-i18n="auth.confirmationHelp"></summary><p class="field-hint" data-i18n="auth.resendHint"></p><form id="resend-form" novalidate><div class="field" data-field><label for="resend-email" data-i18n="field.email"></label><input id="resend-email" name="email" type="email" autocomplete="email" required maxlength="254"></div><button class="button button--secondary" type="submit" data-i18n="auth.resend"></button></form></details><p class="account-link"><span data-i18n="auth.hasAccount"></span> <a href="./giris.html" data-i18n="nav.login"></a></p></section></main>
<footer class="site-footer" data-footer></footer></body></html>
