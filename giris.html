<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,follow"><title data-i18n="auth.loginTitle"></title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"><script type="module" src="/js/account-page.js"></script><link rel="icon" type="image/png" href="/assets/berber-icon.png?v=2"><link rel="apple-touch-icon" href="/assets/berber-icon.png?v=2"></head>
<body><a class="skip-link" href="#main" data-i18n="nav.skip"></a><header class="site-header"><a class="wordmark" href="/index.html" data-i18n-aria-label="brand.home"><img class="brand-logo" src="/assets/berber-logo.png" alt="BERBER" width="2172" height="724" fetchpriority="high"></a><nav class="header-links" data-i18n-aria-label="site.name"><a href="/giris.html" data-i18n="nav.login"></a><a href="/kayit.html" data-i18n="nav.register"></a></nav></header>
<main id="main" class="account-layout" data-account="login"><aside class="account-story"><p class="eyebrow" data-i18n="auth.kicker"></p><h2 data-i18n="auth.heroTitle"></h2><p class="story-text" data-i18n="auth.heroText"></p><p class="story-detail" data-i18n="auth.heroDetail"></p><div class="story-lines" aria-hidden="true"><span></span><span></span><span></span></div></aside><section class="account-card"><p class="eyebrow" data-i18n="nav.login"></p><h1 data-i18n="auth.loginTitle"></h1><p class="intro" data-i18n="auth.loginSubtitle"></p><p class="notice" data-account-status hidden tabindex="-1" aria-live="polite" aria-atomic="true" role="status"></p>
<div data-login-methods><div class="login-tabs" role="tablist" data-i18n-aria-label="nav.login"><button type="button" id="password-tab" role="tab" aria-selected="true" aria-controls="password-panel" tabindex="0" data-i18n="auth.passwordTab"></button><button type="button" id="email-tab" role="tab" aria-selected="false" aria-controls="email-panel" tabindex="-1" data-i18n="auth.emailTab"></button></div>
<div id="password-panel" role="tabpanel" aria-labelledby="password-tab"><form id="password-form" novalidate><div class="field" data-field><label for="login-email" data-i18n="field.email"></label><input id="login-email" name="email" type="email" autocomplete="username" required maxlength="254"></div><div class="field" data-field><label for="login-password" data-i18n="field.password"></label><div class="password-input"><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128" ><button type="button" class="password-toggle" data-password-toggle="login-password" aria-controls="login-password" aria-pressed="false" data-i18n="common.show" data-i18n-aria-label="common.passwordShow"></button></div></div><button class="button" type="submit" data-i18n="auth.loginButton"></button></form></div>
<div id="email-panel" role="tabpanel" aria-labelledby="email-tab" hidden><p class="field-hint" data-i18n="auth.otpHint"></p><form id="email-form" novalidate><div class="field" data-field><label for="otp-email" data-i18n="field.email"></label><input id="otp-email" name="email" type="email" autocomplete="email" required maxlength="254"></div><button type="submit" class="button" data-i18n="auth.otpSend"></button></form><form id="email-code-form" novalidate hidden><div class="field" data-field><label for="code-email" data-i18n="field.email"></label><input id="code-email" name="email" type="email" readonly autocomplete="email"></div><div class="field" data-field><label for="email-code" data-i18n="field.code"></label><input class="code-input" id="email-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></div><button type="submit" class="button" data-i18n="auth.otpVerify"></button><button class="text-button" type="button" data-change-email data-i18n="auth.useAnotherEmail"></button></form></div></div>
<section data-mfa-panel hidden aria-labelledby="mfa-heading"><h2 id="mfa-heading" data-i18n="auth.verifyTitle"></h2><p class="intro" data-i18n="auth.verifyHint"></p><form id="mfa-form" novalidate><div class="field" data-field><label for="factor-id" data-i18n="auth.factorLabel"></label><select id="factor-id" name="factorId" required></select></div><div class="field" data-field><label for="mfa-code" data-i18n="field.code"></label><input class="code-input" id="mfa-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></div><button type="submit" class="button" data-i18n="auth.verifyButton"></button></form><button class="text-button" type="button" data-back-login data-i18n="auth.backToLogin"></button></section>
<details class="resend" data-recovery><summary data-i18n="auth.recoveryLink"></summary><p class="field-hint" data-i18n="security.recoveryLoginHint"></p><p class="field-hint" data-i18n="security.recoveryWarning"></p><form id="recovery-form" novalidate><div class="field" data-field><label for="recovery-code" data-i18n="security.recoveryCode"></label><input id="recovery-code" name="recoveryCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" required></div><button class="button button--secondary" type="submit" data-i18n="security.recover"></button></form></details><details class="resend" data-resend><summary data-i18n="auth.confirmationHelp"></summary><p class="field-hint" data-i18n="auth.resendHint"></p><form id="resend-form" novalidate><div class="field" data-field><label for="resend-email" data-i18n="field.email"></label><input id="resend-email" name="email" type="email" autocomplete="email" required maxlength="254"></div><button class="button button--secondary" type="submit" data-i18n="auth.resend"></button></form></details><p class="account-link"><span data-i18n="auth.noAccount"></span> <a href="/kayit.html" data-i18n="nav.register"></a></p></section></main>
<footer class="site-footer" data-footer></footer></body></html>
