<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,follow"><title data-i18n="security.title"></title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"><script type="module" src="/js/security-page.js"></script><link rel="icon" type="image/png" href="/assets/berber-icon.png?v=2"><link rel="apple-touch-icon" href="/assets/pwa-192.png"><link rel="manifest" href="/manifest.webmanifest"><script type="module" src="/js/pwa.js"></script></head>
<body><a class="skip-link" href="#main" data-i18n="nav.skip"></a><header class="site-header"><a class="wordmark" href="/index.html" data-i18n-aria-label="brand.home"><img class="brand-logo" src="/assets/berber-logo.png" alt="BERBER" width="2172" height="724" fetchpriority="high"></a><div data-security-nav></div></header>
<main id="main" class="security-layout" data-protected hidden><p class="eyebrow" data-i18n="security.title"></p><h1 data-i18n="security.title"></h1><p class="intro" data-i18n="security.subtitle"></p><p class="notice" data-security-status hidden role="status" aria-live="polite" tabindex="-1"></p><section class="security-summary"><span class="security-badge" data-mfa-badge></span><p data-last-login></p><p class="intro" data-i18n="security.optionalHint"></p></section>
<div class="security-grid"><section class="security-card"><h2 data-i18n="security.devices"></h2><ul class="factor-list" data-factors></ul><form id="enroll-form" novalidate><div class="field" data-field><label for="friendly-name" data-i18n="security.factorName"></label><input id="friendly-name" name="friendlyName" type="text" maxlength="60" minlength="2" required autocomplete="off" data-i18n-placeholder="security.factorPlaceholder"></div><button type="submit" class="button" data-i18n="security.addFactor"></button></form></section>
<section class="security-card"><h2 data-i18n="security.recoveryCodes"></h2><p class="intro" data-i18n="security.recoveryHint"></p><p data-code-count></p><form id="regenerate-form" novalidate hidden><div class="field" data-field><label for="regenerate-factor" data-i18n="auth.factorLabel"></label><select id="regenerate-factor" name="factorId" required></select></div><div class="field" data-field><label for="regenerate-code" data-i18n="field.code"></label><input id="regenerate-code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button class="button button--secondary" type="submit" data-i18n="security.regenerate"></button></form></section></div>
<section class="security-card setup-card" data-setup hidden><h2 data-i18n="security.setupTitle"></h2><p class="intro" data-i18n="security.setupHint"></p><p data-i18n="security.scanQr"></p><img class="totp-qr" data-qr data-i18n-alt="security.qrAlt" width="220" height="220"><div class="field"><p data-i18n="security.secret"></p><code class="setup-secret" data-secret></code><button class="text-button" type="button" data-copy-secret data-i18n="common.copy"></button></div><p class="field-hint" data-i18n="security.finishSetupHint"></p><form id="verify-setup-form" novalidate><div class="field" data-field><label for="setup-code" data-i18n="field.code"></label><input id="setup-code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div><button type="submit" class="button" data-i18n="security.verify"></button></form><button type="button" class="text-button" data-cancel-setup data-i18n="security.cancelSetup"></button></section>
<section class="security-card" data-codes hidden><h2 data-i18n="security.recoveryCodes"></h2><p class="notice" data-i18n="security.codesReplaced"></p><ol class="recovery-grid" data-code-list></ol><div class="recovery-actions"><button type="button" class="button button--secondary" data-copy-codes data-i18n="common.copy"></button><button type="button" class="button button--secondary" data-download-codes data-i18n="common.download"></button><button type="button" class="button" data-clear-codes data-i18n="security.saveCodes"></button></div></section></main><footer class="site-footer" data-footer></footer></body></html>
